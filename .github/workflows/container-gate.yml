name: Candidate Container
permissions:
  contents: read
jobs:
  candidate:
    name: candidate-${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: workspace/PrintHub-ZPL-ll
        persist-credentials: false
    - name: Record build time
      id: metadata
      run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
    - name: Build exact candidate without publishing
      uses: Hartmannlight/pipeline-toolkit/actions/build@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        context: workspace/PrintHub-ZPL-ll
        file: workspace/PrintHub-ZPL-ll/Dockerfile
        image: candidate:gate
        platform: linux/${{ matrix.arch }}
    - name: Runtime smoke test
      working-directory: workspace/PrintHub-ZPL-ll
      run: python3 scripts/container_smoke.py candidate:gate
    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: v0.74.0
        cache: true
    - name: Scan image and generate platform SBOM
      working-directory: workspace/PrintHub-ZPL-ll
      run: |
        mkdir -p artifacts
        trivy image --scanners vuln,secret --format json --output "$RUNNER_TEMP/image-scan.json" candidate:gate
        python3 scripts/security_gate.py "$RUNNER_TEMP/image-scan.json"
        trivy image --format spdx-json --output artifacts/sbom.spdx.json candidate:gate
    - name: Export tested candidate
      working-directory: workspace/PrintHub-ZPL-ll
      run: docker save candidate:gate -o artifacts/image.tar
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-${{ matrix.arch }}
        path: |
          workspace/PrintHub-ZPL-ll/artifacts/image.tar
          workspace/PrintHub-ZPL-ll/artifacts/sbom.spdx.json
        retention-days: 3
        compression-level: 0
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: container-reports-${{ matrix.arch }}
        path: |
          workspace/PrintHub-ZPL-ll/artifacts/*scan.json
          workspace/PrintHub-ZPL-ll/artifacts/*.log
        retention-days: 14
'on':
  workflow_call: null
