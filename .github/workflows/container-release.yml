name: Container Release
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/hartmannlight/printhub-zpl-ii
jobs:
  validate:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/ci.yml
  publish-platform:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
        - arm64
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: candidate-${{ matrix.arch }}
        path: candidate
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish the already tested image archive
      id: publish
      env:
        ARCH: ${{ matrix.arch }}
      run: python3 scripts/release.py platform
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-name: ${{ steps.publish.outputs.image }}
        subject-digest: ${{ steps.publish.outputs.digest }}
        push-to-registry: true
    - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
      with:
        subject-name: ${{ steps.publish.outputs.image }}
        subject-digest: ${{ steps.publish.outputs.digest }}
        sbom-path: candidate/sbom.spdx.json
        push-to-registry: true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: platform-digest-${{ matrix.arch }}
        path: metadata/
        retention-days: 14
  publish-index:
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: platform-digest-*
        merge-multiple: true
        path: metadata
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create immutable multiarch index
      id: index
      run: python3 scripts/release.py merge
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-name: ${{ steps.index.outputs.image }}
        subject-digest: ${{ steps.index.outputs.digest }}
        push-to-registry: true
    - name: Promote only after both platforms and attestations passed
      env:
        DIGEST: ${{ steps.index.outputs.digest }}
      run: python3 scripts/release.py promote
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-digest
        path: release-digest.txt
        retention-days: 90
'on':
  push:
    branches:
    - main
    tags:
    - v*
  workflow_dispatch: null
